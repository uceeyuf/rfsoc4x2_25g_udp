<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 345" width="980" height="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="980" height="345" fill="#ffffff"/>
  <rect x="10" y="30" width="960" height="235" rx="8" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="18" y="22" font-weight="bold" fill="#333">RFSoC 4x2 PL (XCZU48DR)</text>

  <g text-anchor="middle">
    <rect x="20" y="50" width="120" height="64" rx="6" fill="#f2f2f2" stroke="#777"/>
    <text x="80" y="73" font-weight="bold">DDS / ramp</text><text x="80" y="91">125 MHz</text><text x="80" y="107" fill="#555">4 Gbps write</text>

    <rect x="170" y="50" width="160" height="64" rx="6" fill="#f2f2f2" stroke="#777"/>
    <text x="250" y="73" font-weight="bold">PL DDR4-2400</text><text x="250" y="91">MIG + AXI DataMover</text><text x="250" y="107" fill="#555">512b @ 300 MHz</text>

    <rect x="360" y="50" width="120" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="420" y="73" font-weight="bold">async FIFO</text><text x="420" y="91">512 → 64 bit</text><text x="420" y="107" fill="#555">250 → 400 MHz</text>

    <rect x="510" y="50" width="170" height="64" rx="6" fill="#d5e8d4" stroke="#82b366"/>
    <text x="595" y="73" font-weight="bold">record_udp_tx</text><text x="595" y="91">sequence header · flows</text><text x="595" y="107" fill="#555">64b @ 400 MHz</text>

    <rect x="710" y="50" width="250" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="835" y="73" font-weight="bold">udp_stack</text><text x="835" y="91">udp_complete_64 · ICMP echo · UDP echo</text><text x="835" y="107" fill="#555">64b @ 400 MHz</text>

    <rect x="760" y="180" width="200" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="860" y="203" font-weight="bold">async frame FIFOs</text><text x="860" y="221">64 @ 400 ↔ 512 @ 322 MHz</text><text x="860" y="237" fill="#555">+ min-frame pad</text>

    <rect x="560" y="180" width="170" height="64" rx="6" fill="#f2f2f2" stroke="#777"/>
    <text x="645" y="203" font-weight="bold">CMAC 100GbE</text><text x="645" y="221">CAUI-4 · RS-FEC</text><text x="645" y="237" fill="#555">512b @ 322 MHz</text>

    <rect x="400" y="290" width="130" height="44" rx="6" fill="#ffffff" stroke="#777"/>
    <text x="465" y="317" font-weight="bold">QSFP28</text>

    <rect x="130" y="290" width="230" height="44" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="245" y="308" font-weight="bold">PC: ConnectX-4 MCX455A</text><text x="245" y="325">Windows · RIO receiver · viewer</text>
  </g>

  <g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="140" y1="82" x2="168" y2="82"/>
    <line x1="330" y1="82" x2="358" y2="82"/>
    <line x1="480" y1="82" x2="508" y2="82"/>
    <line x1="680" y1="82" x2="708" y2="82"/>
    <line x1="860" y1="116" x2="860" y2="178" marker-start="url(#a)"/>
    <line x1="760" y1="212" x2="732" y2="212" marker-start="url(#a)"/>
    <polyline points="645,244 645,312 532,312" marker-start="url(#a)"/>
    <line x1="400" y1="312" x2="362" y2="312" marker-start="url(#a)"/>
  </g>
  <text x="155" y="72" font-size="11" fill="#555" text-anchor="middle">write</text>
  <text x="655" y="280" font-size="11" fill="#555">25.3 Gbps</text>

  <g font-size="12">
    <rect x="600" y="10" width="14" height="14" fill="#d5e8d4" stroke="#82b366"/><text x="620" y="22">this project</text>
    <rect x="700" y="10" width="14" height="14" fill="#dae8fc" stroke="#6c8ebf"/><text x="720" y="22">verilog-ethernet based</text>
    <rect x="860" y="10" width="14" height="14" fill="#f2f2f2" stroke="#777"/><text x="880" y="22">Xilinx IP</text>
  </g>
</svg>
